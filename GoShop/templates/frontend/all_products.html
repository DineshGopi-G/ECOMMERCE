{% extends 'Base.html' %}

{% block content %}

<div class="container mt-5">
    <div class="row">

        {% for i in all_products %}

        <div class="col-md-3 mb-4">
            <!-- FULL CARD CLICK -->
            <a href="{% url 'product_page' i.id %}" style="text-decoration:none; color:inherit;">
                <div class="card h-100 shadow">

                    <!-- Image -->
                    <img src="{{ i.image.url }}" class="card-img-top" style="height:200px; object-fit:cover;"
                        alt="Product Image">

                    <!-- Body -->
                    <div class="card-body d-flex flex-column text-center">

                        <h5 class="card-title">{{ i.name }}</h5>

                        <!-- Description -->
                        <p class="card-text text-muted" class="card-text text-muted text-truncate">
                            {{ i.description }}

                    </div>

                </div>
            </a>
        </div>

        {% endfor %}

    </div>
</div>

{% endblock %}
